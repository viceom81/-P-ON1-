<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>이건 뭐예요? - 낱말 묻고 답하기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5vh 2vw;
      overflow: hidden;
    }

    /* 상단 발문 및 진행도 */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      padding: 0.5vh 1vw;
    }

    .question-title {
      font-size: clamp(36px, 4.5vw, 54px);
      font-weight: 800;
      color: #1E293B;
      text-align: center;
      flex: 1;
      letter-spacing: -1px;
    }

    .progress-badge {
      position: absolute;
      right: 1vw;
      font-size: clamp(22px, 2.3vw, 32px);
      font-weight: 700;
      color: #64748B;
      background: #EDF2F7;
      padding: 6px 18px;
      border-radius: 999px;
    }

    /* 중앙 그림 영역 */
    main {
      flex: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .image-container {
      width: 100%;
      height: 44vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      border-radius: 32px;
      border: 4px solid #E2E8F0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
      overflow: hidden;
      padding: 12px;
    }

    .image-container svg {
      width: 100%;
      height: 100%;
      max-height: 40vh;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.06));
    }

    .image-container.correct-border {
      border-color: #22C55E;
      background-color: #F0FDF4;
      transform: scale(1.02);
    }

    .feedback-message {
      min-height: 44px;
      margin-top: 1.2vh;
      font-size: clamp(28px, 3.2vw, 38px);
      font-weight: 800;
      text-align: center;
    }

    .feedback-correct {
      color: #16A34A;
    }

    .feedback-retry {
      color: #EA580C;
    }

    /* 하단 선택지 버튼 3개 */
    .options-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 1.5vh;
    }

    .option-btn {
      flex: 1;
      min-width: 200px;
      min-height: 100px;
      height: 13vh;
      font-size: clamp(36px, 3.8vw, 48px);
      font-weight: 800;
      color: #1E293B;
      background-color: #FFFFFF;
      border: 4px solid #CBD5E1;
      border-radius: 26px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 0 #94A3B8;
      transition: all 0.1s ease;
      outline: none;
    }

    .option-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #94A3B8;
    }

    .option-btn.correct-choice {
      background-color: #DCFCE7;
      border-color: #22C55E;
      color: #15803D;
      box-shadow: 0 8px 0 #16A34A;
    }

    .option-btn.disabled-choice {
      opacity: 0.25;
      pointer-events: none;
      box-shadow: 0 4px 0 #CBD5E1;
      transform: translateY(4px);
    }

    /* 최하단 네비게이션 바 */
    footer {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1vh;
      border-top: 2px solid #E2E8F0;
    }

    .nav-btn {
      min-height: 46px;
      padding: 8px 20px;
      font-size: 18px;
      font-weight: 700;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 12px;
      cursor: pointer;
      color: #475569;
    }

    .nav-btn:active {
      background: #E2E8F0;
    }

    .question-jump-bar {
      display: flex;
      gap: 8px;
    }

    .jump-btn {
      width: 40px;
      height: 40px;
      font-size: 17px;
      font-weight: 800;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      cursor: pointer;
      color: #475569;
    }

    .jump-btn.active {
      background: #3B82F6;
      color: #FFFFFF;
      border-color: #2563EB;
    }

    /* 최종 완료 화면 */
    .completion-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      height: 60vh;
    }

    .completion-emoji {
      font-size: 110px;
    }

    .completion-title {
      font-size: 52px;
      font-weight: 800;
      color: #1E293B;
    }

    .restart-btn {
      min-width: 240px;
      min-height: 75px;
      font-size: 34px;
      font-weight: 800;
      background-color: #3B82F6;
      color: #FFFFFF;
      border: none;
      border-radius: 22px;
      box-shadow: 0 8px 0 #1D4ED8;
      cursor: pointer;
      margin-top: 10px;
    }

    .restart-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #1D4ED8;
    }
  </style>
</head>
<body>

  <!-- 상단 발문 -->
  <header>
    <div style="width: 80px;"></div>
    <h1 class="question-title">이건 뭐예요?</h1>
    <div class="progress-badge" id="progressBadge">1 / 10</div>
  </header>

  <!-- 중앙 그림 영역 -->
  <main id="quizArea">
    <div class="image-container" id="imageBox">
      <div id="svgMount" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>
    <div class="feedback-message" id="feedbackText"></div>
  </main>

  <!-- 완료 화면 -->
  <div class="completion-view" id="completionArea">
    <div class="completion-emoji">🎉</div>
    <div class="completion-title">참 잘했어요!</div>
    <button class="restart-btn" onclick="restartQuiz()">다시 하기</button>
  </div>

  <!-- 하단 선택지 3개 -->
  <div class="options-container" id="optionsArea">
    <button class="option-btn"></button>
    <button class="option-btn"></button>
    <button class="option-btn"></button>
  </div>

  <!-- 최하단 제어바 -->
  <footer>
    <button class="nav-btn" onclick="restartQuiz()">처음으로</button>
    <div class="question-jump-bar" id="jumpBar"></div>
    <button class="nav-btn" id="soundToggleBtn" onclick="toggleSound()">소리 켜짐 🔊</button>
  </footer>

  <script>

      toothbrush: `

          <!-- 주황/노랑 칫솔 -->

      // 4. 치약 (2080 스타일 튜브)
      toothpaste: `
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <g transform="rotate(-18 150 150)">
            <!-- 뚜껑 -->
            <rect x="40" y="125" width="30" height="50" rx="4" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2"/>
            <!-- 튜브 몸체 -->

            <!-- 흰색 캡슐 데코 -->

      // 5. 수건 (쌓여있는 호텔 수건)
      towel: `
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <!-- 1단 (맨 아래 연두) -->
          <rect x="50" y="220" width="200" height="40" rx="14" fill="#C8E6C9" stroke="#A5D6A7" stroke-width="3"/>
          <line x1="80" y1="220" x2="80" y2="260" stroke="#81C784" stroke-width="4"/>
          <!-- 2단 (하늘색) -->
          <rect x="50" y="175" width="200" height="40" rx="14" fill="#BBDEFB" stroke="#90CAF9" stroke-width="3"/>
          <line x1="80" y1="175" x2="80" y2="215" stroke="#64B5F6" stroke-width="4"/>
          <!-- 3단 (갈색) -->
          <rect x="50" y="130" width="200" height="40" rx="14" fill="#D7CCC8" stroke="#BCAAA4" stroke-width="3"/>
          <line x1="80" y1="130" x2="80" y2="170" stroke="#A1887F" stroke-width="4"/>
          <!-- 4단 (맨 위 파랑) -->
          <rect x="50" y="85" width="200" height="40" rx="14" fill="#90CAF9" stroke="#64B5F6" stroke-width="3"/>
          <line x1="80" y1="85" x2="80" y2="125" stroke="#42A5F5" stroke-width="4"/>
        </svg>`,

      // 6. 물티슈 (캡형 물티슈와 뽑힌 티슈)
      wipes: `
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <!-- 팩 본체 -->
          <rect x="40" y="110" width="220" height="130" rx="28" fill="#00ACC1"/>
          <path d="M40 140 L260 140 L260 210 L40 210 Z" fill="#0097A7"/>
          <!-- 캡 뚜껑 테두리 -->
          <ellipse cx="150" cy="120" rx="55" ry="24" fill="#E0F7FA" stroke="#00838F" stroke-width="3"/>
          <!-- 밖으로 나온 물티슈 -->
          <path d="M130 115 C120 60, 160 50, 155 40 C175 60, 185 85, 170 115 Z" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
          <rect x="85" y="160" width="130" height="45" rx="10" fill="#FFFFFF" opacity="0.95"/>
          <text x="150" y="190" font-size="20" font-weight="900" fill="#00838F" text-anchor="middle">물티슈</text>
        </svg>`,

      // 7. 연필 (노란 연필 묶음)
      pencil: `
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <g transform="rotate(-35 150 150)">
            <!-- 분홍 지우개 -->
            <rect x="135" y="30" width="30" height="35" rx="4" fill="#F48FB1"/>
            <!-- 금색 링 -->
            <rect x="133" y="60" width="34" height="16" fill="#B0BEC5"/>
            <!-- 연필 몸체 -->
            <rect x="135" y="75" width="30" height="150" fill="#FDD835"/>
            <line x1="145" y1="75" x2="145" y2="225" stroke="#FBC02D" stroke-width="3"/>
            <line x1="155" y1="75" x2="155" y2="225" stroke="#F57F17" stroke-width="3"/>
            <!-- 깎인 나무 부분 -->
            <polygon points="135,225 165,225 150,265" fill="#FFE082"/>
            <!-- 흑연 심 -->
            <polygon points="144,248 156,248 150,265" fill="#212121"/>
          </g>
        </svg>`,

      // 8. 지우개
      eraser: `
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <g transform="rotate(-20 150 150)">
            <!-- 지우개 본체 (흰색) -->
            <rect x="60" y="100" width="180" height="100" rx="12" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="4"/>
            <!-- 슬리브 종이 띠 -->
            <rect x="110" y="98" width="132" height="104" rx="8" fill="#FFF9C4" stroke="#D7CCC8" stroke-width="2"/>
            <!-- 녹색 스트라이프 -->
            <rect x="110" y="115" width="132" height="12" fill="#2E7D32"/>
            <rect x="110" y="175" width="132" height="8" fill="#2E7D32"/>
            <text x="176" y="155" font-size="24" font-weight="900" fill="#1B5E20" text-anchor="middle">지우개</text>
            <!-- 지우개 가루 연출 -->
            <circle cx="50" cy="210" r="3" fill="#90A4AE"/>
            <circle cx="70" cy="225" r="4" fill="#90A4AE"/>
            <circle cx="60" cy="240" r="3" fill="#90A4AE"/>

      // 9. 가위 (분홍색 손잡이)

          <!-- 오른쪽 날과 왼쪽 손잡이 -->
          <g transform="rotate(25 150 150)">

          </g>
          <!-- 중심 나사 -->

      // 10. 풀 (딱풀)
      glue: `
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <!-- 상단 뚜껑 (노랑) -->
          <rect x="105" y="40" width="90" height="60" rx="16" fill="#FDD835" stroke="#FBC02D" stroke-width="2"/>
          <!-- 몸체 (초록색 딱풀 본체) -->
          <rect x="110" y="95" width="80" height="135" fill="#2E7D32"/>
          <!-- 모눈 격자선 패턴 -->
          <line x1="130" y1="95" x2="130" y2="230" stroke="#43A047" stroke-width="2"/>
          <line x1="150" y1="95" x2="150" y2="230" stroke="#43A047" stroke-width="2"/>
          <line x1="170" y1="95" x2="170" y2="230" stroke="#43A047" stroke-width="2"/>
          <line x1="110" y1="130" x2="190" y2="130" stroke="#43A047" stroke-width="2"/>
          <line x1="110" y1="165" x2="190" y2="165" stroke="#43A047" stroke-width="2"/>

    // 문제 데이터 목록 (10문항)
    const quizData = [
      { id: 1, name: "시계", svgKey: "clock" },
      { id: 2, name: "컵", svgKey: "cup" },
      { id: 3, name: "칫솔", svgKey: "toothbrush" },
      { id: 4, name: "치약", svgKey: "toothpaste" },
      { id: 5, name: "수건", svgKey: "towel" },
      { id: 6, name: "물티슈", svgKey: "wipes" },
      { id: 7, name: "연필", svgKey: "pencil" },
      { id: 8, name: "지우개", svgKey: "eraser" },
      { id: 9, name: "가위", svgKey: "scissors" },
      { id: 10, name: "풀", svgKey: "glue" }
    ];

    let currentIndex = 0;
    let isSoundOn = true;
    let isTransitioning = false;
    let audioCtx = null;

    // Web Audio API 사운드 초기화
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 정답 피드백 사운드 (도-미-솔 밝은 아르페지오)
    function playCorrectSound() {
      if (!isSoundOn) return;
      initAudioContext();

      const notes = [523.25, 659.25, 783.99];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;

        const startTime = audioCtx.currentTime + idx * 0.08;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.35);
      });
    }

    // 오답(재시도) 피드백 사운드 (부드럽고 낮은 단음)
    function playRetrySound() {
      if (!isSoundOn) return;
      initAudioContext();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(349.23, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(293.66, audioCtx.currentTime + 0.25);

      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // Web Speech API (TTS 음성 안내)
    function speakText(text) {
      if (!isSoundOn || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 0.85; // 느리고 또박또박한 배속
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    // 문제 화면 렌더링
    function loadQuestion(index) {
      isTransitioning = false;
      currentIndex = index;

      document.getElementById("quizArea").style.display = "flex";
      document.getElementById("optionsArea").style.display = "flex";
      document.getElementById("completionArea").style.display = "none";

      const currentItem = quizData[currentIndex];
      
      // 진행도 업데이트 및 내장 SVG 렌더링
      document.getElementById("progressBadge").innerText = `${currentIndex + 1} / ${quizData.length}`;
      document.getElementById("svgMount").innerHTML = graphics[currentItem.svgKey];
      
      // 피드백 박스 초기화
      const imageBox = document.getElementById("imageBox");
      const feedbackText = document.getElementById("feedbackText");
      imageBox.className = "image-container";
      feedbackText.innerText = "";
      feedbackText.className = "feedback-message";

      // 오답 2개 무작위 추출 및 셔플
      const otherNames = quizData
        .filter(item => item.id !== currentItem.id)
        .map(item => item.name);
      
      const shuffledOthers = otherNames.sort(() => 0.5 - Math.random());
      const choices = [currentItem.name, shuffledOthers[0], shuffledOthers[1]].sort(() => 0.5 - Math.random());

      // 선택 버튼 텍스트 설정
      const optionButtons = document.querySelectorAll(".option-btn");
      optionButtons.forEach((btn, idx) => {
        btn.innerText = choices[idx];
        btn.className = "option-btn";
        btn.onclick = () => handleChoice(choices[idx], btn);
      });

      updateJumpBar();
      speakText("이건 뭐예요?");
    }

    // 답안 선택 처리
    function handleChoice(selectedName, buttonEl) {
      if (isTransitioning) return;
      initAudioContext();

      const currentItem = quizData[currentIndex];
      const imageBox = document.getElementById("imageBox");
      const feedbackText = document.getElementById("feedbackText");

      if (selectedName === currentItem.name) {
        // [정답 로직]
        isTransitioning = true;
        playCorrectSound();
        speakText(currentItem.name);

        imageBox.classList.add("correct-border");
        buttonEl.classList.add("correct-choice");
        feedbackText.innerText = "맞았어요! 👏";
        feedbackText.className = "feedback-message feedback-correct";

        // 2초 뒤 다음 문제로 이동
        setTimeout(() => {
          if (currentIndex < quizData.length - 1) {
            loadQuestion(currentIndex + 1);
          } else {
            showCompletion();
          }
        }, 2000);

      } else {
        // [오답 로직 - 부드러운 유도]
        playRetrySound();
        feedbackText.innerText = "다시 해 볼까요? 😊";
        feedbackText.className = "feedback-message feedback-retry";
        
        // 누른 버튼을 흐리게 처리
        buttonEl.classList.add("disabled-choice");
      }
    }

    // 10문제 완료 축하 화면
    function showCompletion() {
      document.getElementById("quizArea").style.display = "none";
      document.getElementById("optionsArea").style.display = "none";
      document.getElementById("completionArea").style.display = "flex";
      document.getElementById("progressBadge").innerText = "10 / 10";

      playCorrectSound();
      speakText("참 잘했어요!");
    }

    // 하단 1~10 바로가기 번호 버튼 생성
    function initJumpBar() {
      const bar = document.getElementById("jumpBar");
      bar.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "jump-btn";
        btn.innerText = idx + 1;
        btn.onclick = () => loadQuestion(idx);
        bar.appendChild(btn);
      });
    }

    function updateJumpBar() {
      const buttons = document.querySelectorAll(".jump-btn");
      buttons.forEach((btn, idx) => {
        if (idx === currentIndex) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    }

    // 다시 하기 및 소리 토글
    function restartQuiz() {
      loadQuestion(0);
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const btn = document.getElementById("soundToggleBtn");
      btn.innerText = isSoundOn ? "소리 켜짐 🔊" : "소리 꺼짐 🔇";
      if (!isSoundOn && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      initJumpBar();
      loadQuestion(0);
    });
  </script>
</body>
</html>
